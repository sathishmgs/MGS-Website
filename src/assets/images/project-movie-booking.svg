<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" fill="none">
  <defs>
    <linearGradient id="movBg" x1="0" y1="0" x2="640" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080718" />
      <stop offset="100%" stop-color="#140c2e" />
    </linearGradient>
    <linearGradient id="movAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="screenCurve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="640" height="380" fill="url(#movBg)" />
  <circle cx="530" cy="90" r="160" fill="#a855f7" fill-opacity="0.14" />
  <circle cx="110" cy="300" r="140" fill="#38bdf8" fill-opacity="0.12" />

  <!-- App Window Frame -->
  <rect x="36" y="28" width="568" height="324" rx="14" fill="#0c0e22" stroke="#251d45" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="36" y="28" width="568" height="36" rx="14" fill="#131533" />
  <circle cx="58" cy="46" r="5" fill="#ef4444" />
  <circle cx="74" cy="46" r="5" fill="#f59e0b" />
  <circle cx="90" cy="46" r="5" fill="#10b981" />
  <text x="320" y="50" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">M-G-S Cinema • Movie Ticket Booking System</text>

  <!-- Left: Movie Posters List -->
  <g transform="translate(56, 76)">
    <!-- Movie 1 Card -->
    <rect width="160" height="116" rx="8" fill="#17193b" stroke="#312e81" stroke-width="1.2" />
    <rect x="10" y="10" width="50" height="70" rx="4" fill="url(#movAccent)" fill-opacity="0.4" stroke="#a855f7" />
    <text x="70" y="26" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Avatar: Way</text>
    <text x="70" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">IMAX 3D • 3h 12m</text>
    <rect x="70" y="52" width="46" height="14" rx="3" fill="#3b82f6" fill-opacity="0.25" />
    <text x="93" y="62" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="8" font-weight="600">ACTION</text>
    <rect x="10" y="88" width="140" height="20" rx="4" fill="#7c3aed" />
    <text x="80" y="102" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700">Book Seats</text>
  </g>

  <g transform="translate(56, 204)">
    <!-- Movie 2 Card -->
    <rect width="160" height="136" rx="8" fill="#17193b" stroke="#312e81" stroke-width="1.2" />
    <rect x="10" y="10" width="50" height="70" rx="4" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" />
    <text x="70" y="26" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Interstellar</text>
    <text x="70" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Sci-Fi • 2h 49m</text>
    <rect x="70" y="52" width="44" height="14" rx="3" fill="#10b981" fill-opacity="0.25" />
    <text x="92" y="62" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="8" font-weight="600">TOP RATED</text>
    <rect x="10" y="90" width="140" height="20" rx="4" fill="#2563eb" />
    <text x="80" y="104" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700">Showtimes</text>
    <text x="80" y="126" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="9">Admin Portal Access →</text>
  </g>

  <!-- Right: Cinema Screen & Interactive Seat Grid -->
  <g transform="translate(236, 76)">
    <rect width="352" height="264" rx="10" fill="#0f1129" stroke="#251d45" />
    
    <!-- Curved Screen -->
    <path d="M40 38 Q 176 16 312 38" stroke="url(#screenCurve)" stroke-width="4" stroke-linecap="round" fill="none" />
    <text x="176" y="54" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9" letter-spacing="0.1em">CINEMA SCREEN</text>

    <!-- Seat rows -->
    <!-- Row A -->
    <g transform="translate(56, 72)">
      <rect x="0" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
      <rect x="28" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
      <rect x="56" y="0" width="20" height="18" rx="4" fill="#475569" />
      <rect x="96" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
      <rect x="124" y="0" width="20" height="18" rx="4" fill="#a855f7" />
      <rect x="152" y="0" width="20" height="18" rx="4" fill="#a855f7" />
      <rect x="192" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
      <rect x="220" y="0" width="20" height="18" rx="4" fill="#475569" />
    </g>
    <!-- Row B -->
    <g transform="translate(56, 98)">
      <rect x="0" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
      <rect x="28" y="0" width="20" height="18" rx="4" fill="#475569" />
      <rect x="56" y="0" width="20" height="18" rx="4" fill="#475569" />
      <rect x="96" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
      <rect x="124" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
      <rect x="152" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
      <rect x="192" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
      <rect x="220" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
    </g>
    <!-- Row C -->
    <g transform="translate(56, 124)">
      <rect x="0" y="0" width="20" height="18" rx="4" fill="#475569" />
      <rect x="28" y="0" width="20" height="18" rx="4" fill="#475569" />
      <rect x="56" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
      <rect x="96" y="0" width="20" height="18" rx="4" fill="#a855f7" />
      <rect x="124" y="0" width="20" height="18" rx="4" fill="#a855f7" />
      <rect x="152" y="0" width="20" height="18" rx="4" fill="#475569" />
      <rect x="192" y="0" width="20" height="18" rx="4" fill="#475569" />
      <rect x="220" y="0" width="20" height="18" rx="4" fill="#3b82f6" />
    </g>

    <!-- Legend -->
    <g transform="translate(56, 160)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#3b82f6" />
      <text x="18" y="10" fill="#94a3b8" font-family="sans-serif" font-size="9">Available</text>
      <rect x="80" y="0" width="12" height="12" rx="3" fill="#a855f7" />
      <text x="98" y="10" fill="#c4b5fd" font-family="sans-serif" font-size="9">Selected (2)</text>
      <rect x="164" y="0" width="12" height="12" rx="3" fill="#475569" />
      <text x="182" y="10" fill="#94a3b8" font-family="sans-serif" font-size="9">Occupied</text>
    </g>

    <!-- Booking Summary Bottom Bar -->
    <g transform="translate(18, 192)">
      <rect width="316" height="54" rx="8" fill="#181a3d" stroke="#312e81" />
      <text x="16" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">Seats: A5, A6 • Hall 2</text>
      <text x="16" y="42" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">₹360.00 Total</text>
      <rect x="210" y="12" width="94" height="30" rx="6" fill="url(#movAccent)" />
      <text x="257" y="31" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="700">Checkout</text>
    </g>
  </g>
</svg>